<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zynk Chat | Plataforma Profissional de Mensagens</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* ==================================== */
        /* 1. CSS: DESIGN & LAYOUT              */
        /* ==================================== */

        /* RESET E TIPOGRAFIA BASE */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s, color 0.3s;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* TEMA PRETO (DARK MODE - DEFAULT) */
        .theme-dark {
            --bg-color-main: #121212; /* Fundo principal escuro */
            --bg-color-sidebar: #1E1E1E; /* Sidebar um pouco mais clara */
            --text-color: #FFFFFF; /* Texto principal branco */
            --text-color-light: #A0A0A0; /* Texto secundário/meta */
            --chat-bg-color: #000000; /* Fundo da área de chat */
            --admin-bubble-bg: #FFFFFF; /* Balão Admin: Branco */
            --admin-bubble-text: #000000; /* Texto Balão Admin: Preto */
            --visitor-bubble-bg: #2C2C2C; /* Balão Visitante: Cinza Escuro */
            --visitor-bubble-text: #FFFFFF; /* Texto Balão Visitante: Branco */
            --input-bg: #333333; /* Fundo da barra de entrada */
            --border-color: #333333;
            --logo-color: #FFFFFF;
        }

        /* TEMA BRANCO (LIGHT MODE) */
        .theme-light {
            --bg-color-main: #F9F9F9; /* Fundo principal claro */
            --bg-color-sidebar: #FFFFFF; /* Sidebar branca */
            --text-color: #000000;
            --text-color-light: #555555;
            --chat-bg-color: #EEEEEE;
            --admin-bubble-bg: #000000; /* Balão Admin: Preto */
            --admin-bubble-text: #FFFFFF; /* Texto Balão Admin: Branco */
            --visitor-bubble-bg: #F0F0F0; /* Balão Visitante: Cinza Claro */
            --visitor-bubble-text: #000000; /* Texto Balão Visitante: Preto */
            --input-bg: #FFFFFF;
            --border-color: #E0E0E0;
            --logo-color: #000000;
        }

        /* LAYOUT PRINCIPAL (GRID p/ Desktop) */
        #zynk-chat-app {
            display: grid;
            grid-template-columns: 350px 1fr; /* Desktop: Sidebar 350px, Chat 1fr */
            height: 100vh;
            background-color: var(--bg-color-main);
            color: var(--text-color);
        }

        /* SIDEBAR (Coluna Esquerda) */
        #sidebar {
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color-sidebar);
            border-right: 1px solid var(--border-color);
            overflow-y: hidden; 
            flex-shrink: 0;
        }

        #sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--logo-color);
        }

        /* SEARCH BAR */
        #search-container {
            padding: 10px 20px;
            position: relative;
            flex-shrink: 0;
        }

        #search-conversations {
            width: 100%;
            padding: 8px 10px 8px 40px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 0.9em;
        }

        #search-conversations::placeholder {
            color: var(--text-color-light);
        }

        .search-icon {
            position: absolute;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-color-light);
            font-size: 1em;
        }

        /* Lista de Conversas */
        #conversations-list {
            list-style: none;
            flex-grow: 1;
            overflow-y: auto;
        }

        .conversation-item {
            display: flex;
            padding: 15px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.2s;
        }

        .conversation-item:hover, .conversation-item.active {
            background-color: var(--border-color);
        }
        .conversation-item.active {
            box-shadow: 2px 0 0 0 var(--logo-color) inset;
        }

        /* Layout do item de conversa */
        .conversation-item .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--logo-color);
            color: var(--bg-color-sidebar);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 600;
            margin-right: 10px;
            flex-shrink: 0;
            border: 1px solid var(--border-color);
        }

        .conversation-item .info {
            flex-grow: 1;
            overflow: hidden;
        }

        .conversation-item .name {
            font-weight: 600;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conversation-item .last-msg-preview {
            font-size: 0.9em;
            color: var(--text-color-light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conversation-item .meta {
            text-align: right;
            font-size: 0.8em;
            color: var(--text-color-light);
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            margin-left: 10px;
            flex-shrink: 0;
        }

        .unread-badge {
            background-color: #FF0000; /* Destaque para notificação */
            color: #FFFFFF;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 0.7em;
            font-weight: 700;
            margin-top: 5px;
        }

        /* Rodapé de Configurações (Visitante) */
        #visitor-settings {
            display: flex;
            padding: 10px 20px;
            border-top: 1px solid var(--border-color);
            align-items: center;
            flex-shrink: 0;
        }

        #display-name-input {
            flex-grow: 1;
            padding: 5px 10px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            border-radius: 5px;
            font-size: 0.9em;
        }

        #visitor-settings button {
            background: none;
            border: none;
            color: var(--text-color-light);
            cursor: pointer;
            font-size: 1.2em;
            margin-left: 10px;
            transition: color 0.2s;
        }

        #visitor-settings button:hover {
            color: var(--logo-color);
        }

        /* CHAT AREA (Coluna Direita) */
        #chat-area {
            display: flex;
            flex-direction: column;
            background-color: var(--chat-bg-color);
        }

        /* Header do Chat */
        #chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-color-sidebar);
            flex-shrink: 0;
        }

        .user-info {
            display: flex;
            align-items: center;
        }

        #current-chat-name {
            font-weight: 600;
        }

        .status {
            font-size: 0.9em;
            margin-left: 10px;
            padding: 2px 6px;
            border-radius: 10px;
        }

        .status.online {
            color: #00FF00; /* Indicador Online */
        }

        .status.offline {
            color: var(--text-color-light);
        }

        /* Mensagens (Área de Scroll) */
        #messages-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .welcome-message {
            text-align: center;
            margin: auto;
            max-width: 60%;
            color: var(--text-color-light);
        }

        .message-item {
            display: flex;
            margin-bottom: 10px;
        }

        /* Balões do ADMIN (Direita) */
        .message-item.admin {
            justify-content: flex-end;
        }

        .message-item.admin .bubble {
            background-color: var(--admin-bubble-bg);
            color: var(--admin-bubble-text);
            border-radius: 10px 10px 0 10px;
        }

        /* Balões do VISITANTE (Esquerda) */
        .message-item.visitor {
            justify-content: flex-start;
        }

        .message-item.visitor .bubble {
            background-color: var(--visitor-bubble-bg);
            color: var(--visitor-bubble-text);
            border-radius: 10px 10px 10px 0;
        }

        .bubble {
            max-width: 65%;
            padding: 10px 15px;
            word-wrap: break-word;
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
            position: relative;
            font-size: 0.95em;
        }

        .message-time {
            display: block;
            font-size: 0.7em;
            margin-top: 5px;
            color: inherit;
            opacity: 0.7;
            text-align: right;
        }

        /* Input Bar (Rodapé Fixo) */
        #chat-input-bar {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            border-top: 1px solid var(--border-color);
            background-color: var(--bg-color-sidebar);
            flex-shrink: 0;
        }

        #message-input {
            flex-grow: 1;
            border: none;
            background-color: var(--input-bg);
            color: var(--text-color);
            padding: 10px 15px;
            border-radius: 20px;
            margin: 0 10px;
            resize: none;
            font-size: 1em;
            max-height: 80px;
            overflow-y: auto;
            transition: background-color 0.2s;
        }

        #message-input:focus {
            outline: none;
            box-shadow: 0 0 0 2px var(--logo-color);
        }

        #chat-input-bar button {
            background: none;
            border: none;
            color: var(--text-color-light);
            cursor: pointer;
            font-size: 1.5em;
            padding: 5px;
            transition: color 0.2s;
        }

        #chat-input-bar button:hover {
            color: var(--logo-color);
        }

        /* Elementos de Menu e Botões */
        button {
            background-color: var(--text-color);
            color: var(--bg-color-sidebar);
            border: none;
            border-radius: 5px;
            padding: 8px 10px;
            cursor: pointer;
            transition: opacity 0.2s;
            font-size: 1em;
        }

        button:hover {
            opacity: 0.8;
        }

        /* RESPONSIVIDADE (Mobile/Tablet) */
        .menu-mobile-btn {
            display: none; /* Esconder por padrão */
        }

        @media (max-width: 768px) {
            #zynk-chat-app {
                grid-template-columns: 1fr; /* Coluna única */
            }

            #sidebar {
                position: absolute;
                width: 100%;
                max-width: 350px;
                height: 100%;
                z-index: 100;
                transform: translateX(-100%);
                transition: transform 0.3s ease-out;
            }

            #sidebar.open {
                transform: translateX(0); /* Mostrar sidebar em mobile */
                box-shadow: 5px 0 15px rgba(0, 0, 0, 0.5);
            }

            #chat-area {
                width: 100%;
            }

            .menu-mobile-btn {
                display: block; /* Mostrar botão de menu */
            }

            /* Esconder o logo quando sidebar estiver fechada para dar mais espaço */
            #sidebar-header .logo {
                display: none;
            }

            #chat-header .user-info {
                max-width: 70%;
                overflow: hidden;
            }
        }
    </style>
</head>

<body class="theme-dark">

    <div id="zynk-chat-app" class="theme-dark">

        <aside id="sidebar">
            <header id="sidebar-header">
                <h1 class="logo">Zynk Chat</h1>
                <button id="admin-login-btn" title="Área do Admin"><i class="fas fa-user-shield"></i></button>
            </header>

            <div id="search-container">
                <input type="text" id="search-conversations" placeholder="Buscar conversas por nome/IP..." onkeyup="searchConversations()">
                <i class="fas fa-search search-icon"></i>
            </div>

            <ul id="conversations-list">
                </ul>

            <footer id="visitor-settings">
                <input type="text" id="display-name-input" placeholder="Seu Nome de Exibição" title="Apenas para esta sessão.">
                <button id="clear-history-btn" title="Limpar Histórico Local"><i class="fas fa-trash-alt"></i></button>
                <button id="theme-toggle-btn" title="Alternar Tema Preto/Branco"><i class="fas fa-adjust"></i></button>
            </footer>
        </aside>

        <main id="chat-area">
            <header id="chat-header">
                <div class="user-info">
                    <span id="current-chat-name">Selecione uma Conversa</span>
                    <span id="current-chat-status" class="status online">Online</span>
                </div>
                <div class="options-menu">
                    <button title="Opções"><i class="fas fa-ellipsis-v"></i></button>
                    <button class="menu-mobile-btn" title="Menu"><i class="fas fa-bars"></i></button>
                </div>
            </header>

            <div id="messages-container">
                <div class="welcome-message">
                    <h2>Bem-vindo(a) ao Zynk Chat!</h2>
                    <p>Sua conversa está identificada pelo seu endereço IP. Envie uma mensagem para começar.</p>
                </div>
            </div>

            <footer id="chat-input-bar">
                <button id="emoji-picker-btn" title="Emojis"><i class="far fa-smile"></i></button>
                <textarea id="message-input" placeholder="Digite sua mensagem..." rows="1"></textarea>
                <button id="send-btn" title="Enviar Mensagem"><i class="fas fa-paper-plane"></i></button>
            </footer>
        </main>
    </div>

    <script>
        /* ==================================== */
        /* 2. JAVASCRIPT: LÓGICA E PERSISTÊNCIA */
        /* ==================================== */

        // VARIÁVEIS GLOBAIS
        let currentIP = null; 
        let isUserAdmin = false; 
        let conversations = {}; 
        let currentDisplayName = ''; 

        const ELEMENTS = {
            app: document.getElementById('zynk-chat-app'),
            sidebar: document.getElementById('sidebar'),
            conversationsList: document.getElementById('conversations-list'),
            messagesContainer: document.getElementById('messages-container'),
            messageInput: document.getElementById('message-input'),
            sendButton: document.getElementById('send-btn'),
            currentChatName: document.getElementById('current-chat-name'),
            displayNameInput: document.getElementById('display-name-input'),
            clearHistoryBtn: document.getElementById('clear-history-btn'),
            themeToggleBtn: document.getElementById('theme-toggle-btn'),
            mobileMenuBtn: document.querySelector('.menu-mobile-btn'),
            adminLoginBtn: document.getElementById('admin-login-btn'),
            searchConversations: document.getElementById('search-conversations')
        };

        // --- FUNÇÕES DE UTILIDADE E PERSISTÊNCIA ---

        function getSimulatedIP() {
            let ip = localStorage.getItem('zynk_user_ip');
            if (!ip) {
                // Gera um IP local simulado
                ip = `192.168.${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}`;
                localStorage.setItem('zynk_user_ip', ip);
            }
            return ip;
        }
        
        function loadData() {
            const storedConversations = localStorage.getItem('zynk_conversations');
            if (storedConversations) {
                conversations = JSON.parse(storedConversations);
            }
            currentDisplayName = localStorage.getItem('zynk_display_name') || '';
            ELEMENTS.displayNameInput.value = currentDisplayName;
        }

        function saveData() {
            localStorage.setItem('zynk_conversations', JSON.stringify(conversations));
        }
        
        function updateDisplayName(name) {
            currentDisplayName = name.trim();
            localStorage.setItem('zynk_display_name', currentDisplayName);
            // Atualiza o nome do chat para o visitante
            if (!isUserAdmin) {
                ELEMENTS.currentChatName.textContent = currentDisplayName || `Conversa com Visitante #${currentIP}`;
            }
        }

        // --- LÓGICA DE RENDERIZAÇÃO E CHAT ---

        function createMessageBubble(message) {
            const item = document.createElement('div');
            item.className = `message-item ${message.senderRole}`;

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = `
                <span>${message.text}</span>
                <span class="message-time">${message.time}</span>
            `;

            item.appendChild(bubble);
            return item;
        }
        
        function renderMessages(ip) {
            ELEMENTS.messagesContainer.innerHTML = '';
            const chatHistory = conversations[ip] || [];
            
            // Define o nome de exibição no cabeçalho do chat
            let chatName = `Visitante #${ip}`;
            if (ip === getSimulatedIP() && currentDisplayName) {
                chatName = currentDisplayName;
            }
            ELEMENTS.currentChatName.textContent = isUserAdmin ? `Conversa com ${chatName}` : chatName;

            if (chatHistory.length === 0) {
                ELEMENTS.messagesContainer.innerHTML = `
                    <div class="welcome-message">
                        <h2>Converse com o ${isUserAdmin ? 'Visitante' : 'Admin'}</h2>
                        <p>Seu ID: <strong>${ip}</strong></p>
                    </div>
                `;
                return;
            }

            chatHistory.forEach(msg => {
                ELEMENTS.messagesContainer.appendChild(createMessageBubble(msg));
            });

            ELEMENTS.messagesContainer.scrollTop = ELEMENTS.messagesContainer.scrollHeight;
        }
        
        function renderConversationsList(filter = '') {
            ELEMENTS.conversationsList.innerHTML = '';
            
            // Define quais IPs devem ser renderizados
            const allIps = Object.keys(conversations);
            const ipsToRender = isUserAdmin ? allIps : [currentIP];

            ipsToRender
                .filter(ip => {
                    const history = conversations[ip] || [];
                    // Visitante sempre vê seu próprio chat, mesmo vazio. Admin só vê chats com histórico.
                    if (!isUserAdmin && ip === currentIP) return true; 
                    return history.length > 0;
                })
                .sort((a, b) => {
                    // Ordena pela última mensagem
                    const timeA = conversations[a] ? conversations[a][conversations[a].length - 1].timestamp : 0;
                    const timeB = conversations[b] ? conversations[b][conversations[b].length - 1].timestamp : 0;
                    return timeB - timeA;
                })
                .filter(ip => {
                    if (!filter) return true;
                    // Busca por IP ou nome/conteúdo
                    const name = `Visitante #${ip}`;
                    const history = conversations[ip] || [];
                    const contentMatch = history.some(msg => msg.text.toLowerCase().includes(filter.toLowerCase()));
                    return name.toLowerCase().includes(filter.toLowerCase()) || contentMatch;
                })
                .forEach(ip => {
                    const history = conversations[ip] || [];
                    const lastMessage = history.length > 0 ? history[history.length - 1] : {text: 'Inicie a conversa', time: '', senderRole: 'admin'};
                    
                    let chatName = `Visitante #${ip}`;
                    if (ip === getSimulatedIP() && currentDisplayName) {
                        chatName = currentDisplayName;
                    }
                    
                    const li = document.createElement('li');
                    li.className = `conversation-item ${ip === currentIP ? 'active' : ''}`;
                    li.dataset.ip = ip;
                    
                    const initial = chatName[0] ? chatName[0].toUpperCase() : ip.split('.').pop()[0]; 
                    
                    // Notificação de não lida para o Admin se a última mensagem foi do visitante
                    const isUnread = isUserAdmin && lastMessage.senderRole === 'visitor' && ip !== currentIP;
                    
                    li.innerHTML = `
                        <div class="avatar">${initial}</div>
                        <div class="info">
                            <span class="name">${chatName}</span>
                            <p class="last-msg-preview">${lastMessage.text}</p>
                        </div>
                        <div class="meta">
                            <span class="time">${lastMessage.time}</span>
                            ${isUnread ? '<span class="unread-badge">!</span>' : ''}
                        </div>
                    `;
                    
                    li.addEventListener('click', () => {
                        currentIP = ip; 
                        if (window.innerWidth <= 768) ELEMENTS.sidebar.classList.remove('open');
                        renderMessages(ip);
                        renderConversationsList();
                    });

                    ELEMENTS.conversationsList.appendChild(li);
                });
        }

        function searchConversations() {
            const filter = ELEMENTS.searchConversations.value.trim();
            renderConversationsList(filter);
        }

        function sendMessage(text, senderRole) {
            const ip = currentIP;
            const now = new Date();
            const message = {
                text: text,
                senderRole: senderRole,
                time: now.toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'}),
                timestamp: now.getTime()
            };

            if (!conversations[ip]) {
                conversations[ip] = [];
            }
            
            conversations[ip].push(message);
            saveData();
            renderMessages(ip);
            renderConversationsList();
            
            // Simulação de Resposta Automática
            if (!isUserAdmin && conversations[currentIP].length === 1) {
                setTimeout(() => {
                    sendMessage('Olá! Sua solicitação foi recebida. Um administrador entrará em contato em breve.', 'admin');
                }, 1500);
            }
        }

        // --- EVENT HANDLERS CORRIGIDOS ---

        function handleAdminLogin() {
            // Credenciais Reais
            const ADMIN_USER = 'admin';
            const ADMIN_PASS = 'Mads01'; // Senha definida

            if (isUserAdmin) {
                // --- LOGOUT ---
                isUserAdmin = false;
                alert('Sessão Admin encerrada. Voltando ao modo Visitante.');
                currentIP = getSimulatedIP(); // Retorna para a conversa do visitante atual
            } else {
                // --- LOGIN ---
                const user = prompt('Usuário (admin):');
                const pass = prompt('Senha (Mads01):'); 
                
                if (user === ADMIN_USER && pass === ADMIN_PASS) {
                    isUserAdmin = true;
                    
                    // Após o login, definimos o IP ativo para a primeira conversa disponível.
                    const allIps = Object.keys(conversations);
                    if (allIps.length > 0) {
                        currentIP = allIps[0]; // Seleciona a primeira conversa da lista
                    } else {
                        currentIP = getSimulatedIP(); // Se não houver conversas, fica na dele
                    }
                    
                    alert('Login Admin bem-sucedido! Você pode ver e responder a todas as conversas.');
                } else {
                    alert('Credenciais inválidas. (Usuário: admin / Senha: Mads01)');
                }
            }
            
            // Atualiza o botão, a lista de conversas e o chat principal
            ELEMENTS.adminLoginBtn.innerHTML = isUserAdmin ? '<i class="fas fa-sign-out-alt"></i>' : '<i class="fas fa-user-shield"></i>';
            renderConversationsList();
            renderMessages(currentIP);
        }

        function handleThemeToggle() {
            const isDark = ELEMENTS.app.classList.contains('theme-dark');
            ELEMENTS.app.classList.toggle('theme-dark', !isDark);
            ELEMENTS.app.classList.toggle('theme-light', isDark);
            document.body.classList.toggle('theme-dark', !isDark);
            document.body.classList.toggle('theme-light', isDark);
        }
        
        function handleClearHistory() {
            if (confirm('Tem certeza que deseja limpar TODO o seu histórico de chat local?')) {
                localStorage.clear();
                window.location.reload();
            }
        }

        // Auto-ajuste de altura do textarea
        function autoResizeTextarea() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        }

        // --- INICIALIZAÇÃO ---

        function init() {
            loadData();
            currentIP = getSimulatedIP();
            
            // Inicializa o chat com a conversa do visitante atual
            renderConversationsList();
            renderMessages(currentIP);

            // Event Listeners
            ELEMENTS.sendButton.addEventListener('click', handleSend);
            ELEMENTS.messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSend();
                }
            });
            ELEMENTS.messageInput.addEventListener('input', autoResizeTextarea);
            ELEMENTS.displayNameInput.addEventListener('change', (e) => updateDisplayName(e.target.value));
            ELEMENTS.mobileMenuBtn.addEventListener('click', () => ELEMENTS.sidebar.classList.toggle('open'));
            ELEMENTS.adminLoginBtn.addEventListener('click', handleAdminLogin);
            ELEMENTS.themeToggleBtn.addEventListener('click', handleThemeToggle);
            ELEMENTS.clearHistoryBtn.addEventListener('click', handleClearHistory);
            
            // Simulação de Status Online
            setInterval(() => {
                const statusElement = document.getElementById('current-chat-status');
                if (statusElement) {
                     statusElement.className = 'status online'; 
                }
            }, 5000);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
